<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>多目标跟踪回放</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2233; --border: #2a3550;
    --text: #e8ecf4; --dim: #9aa4b2; --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--text);
         font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  #metrics { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .metric { background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; padding: 8px 14px; font-size: 13px; }
  .metric b { display: block; font-size: 18px; margin-top: 2px; color: var(--accent); }
  #main { display: flex; gap: 16px; align-items: flex-start; }
  canvas { background: #0b101c; border: 1px solid var(--border); border-radius: 8px; }
  #side { width: 260px; }
  #side h3 { font-size: 13px; color: var(--dim); margin: 0 0 8px; text-transform: uppercase; }
  #frameInfo { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
               padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
  #events { list-style: none; margin: 0 0 12px; padding: 0; min-height: 120px;
            background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  #events li { font-size: 13px; padding: 4px 8px; border-radius: 4px; margin-bottom: 4px; }
  #events li.empty { color: var(--dim); }
  .ev-born      { background: rgba(60, 179, 75, .18);  color: #7fe08c; }
  .ev-confirmed { background: rgba(77, 163, 255, .18); color: #8cc4ff; }
  .ev-recovered { background: rgba(245, 166, 35, .18); color: #ffc46b; }
  .ev-deleted   { background: rgba(230, 60, 60, .18);  color: #ff8a8a; }
  .ev-pruned    { background: rgba(154, 164, 178, .12); color: var(--dim); }
  #legend { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 14px; font-size: 12px; color: var(--dim); line-height: 1.9; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
        margin-right: 6px; vertical-align: middle; }
  #controls { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 6px; }
  #frameLabel { font-variant-numeric: tabular-nums; min-width: 90px; text-align: center; }
</style>
</head>
<body>
<h1>多目标跟踪：观测-航迹关联逐帧回放</h1>
<div id="metrics"></div>
<div id="main">
  <canvas id="cv"></canvas>
  <div id="side">
    <h3>当前帧</h3>
    <div id="frameInfo"></div>
    <h3>本帧事件</h3>
    <ul id="events"></ul>
    <h3>图例</h3>
    <div id="legend">
      <span class="sw" style="background:#9aa4b2"></span>未关联观测（杂波/新点）<br>
      <span class="sw" style="background:#e8ecf4"></span>已关联观测（连线到航迹）<br>
      <span class="sw" style="background:transparent;border:2px solid #4da3ff"></span>暂态航迹（未确认）<br>
      <span class="sw" style="background:#4da3ff"></span>确认航迹（数字为 ID）<br>
      <span class="sw" style="background:transparent;border:2px dashed #ffc46b"></span>遮挡滑行中（漏关联）<br>
      事件高亮：<b style="color:#7fe08c">新生</b> /
      <b style="color:#8cc4ff">确认</b> /
      <b style="color:#ffc46b">遮挡恢复</b> /
      <b style="color:#ff8a8a">消亡</b>
    </div>
  </div>
</div>
<div id="controls">
  <button id="playBtn">▶ 播放</button>
  <button id="prevBtn">⟨ 上一帧</button>
  <button id="nextBtn">下一帧 ⟩</button>
  <input type="range" id="slider" min="0" value="0">
  <span id="frameLabel"></span>
  <select id="speed">
    <option value="400">0.5×</option>
    <option value="200" selected>1×</option>
    <option value="100">2×</option>
    <option value="50">4×</option>
  </select>
</div>

        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(t.x, t.y, 13, 0, 6.2832); ctx.stroke();
      }
    }
    // ID 标签
    ctx.fillStyle = '#e8ecf4';
    ctx.font = '11px monospace';
    ctx.fillText('#' + t.id, t.x + 9, t.y - 8);
  });

  // 侧栏
  document.getElementById('frameLabel').textContent = '帧 ' + cur + ' / ' + lastFrame;
  var nConf = fr.tracks.filter(function(t) { return t.state === 'confirmed' && t.event !== 'deleted'; }).length;
  var nTent = fr.tracks.filter(function(t) { return t.state === 'tentative' && t.event !== 'pruned'; }).length;
  document.getElementById('frameInfo').innerHTML =
    '观测 <b>' + fr.obs.length + '</b> 个 · 确认航迹 <b>' + nConf +
    '</b> 条 · 暂态 <b>' + nTent + '</b> 条';
  var ev = document.getElementById('events');
  var items = fr.tracks.filter(function(t) { return t.event; });
  if (!items.length) {
    ev.innerHTML = '<li class="empty">（无事件）</li>';
  } else {
    ev.innerHTML = items.map(function(t) {
      var e = EVENT_TEXT[t.event];
      return '<li class="' + e[1] + '">航迹 #' + t.id + ' ' + e[0] + '</li>';
    }).join('');
  }
  slider.value = cur;
}

function step(d) {
  cur = Math.max(0, Math.min(lastFrame, cur + d));
  draw();
}
function stop() {
  playing = false;
  clearInterval(timer);
  document.getElementById('playBtn').textContent = '▶ 播放';
}
document.getElementById('playBtn').onclick = function() {
  if (playing) { stop(); return; }
  playing = true;
  this.textContent = '⏸ 暂停';
  var interval = parseInt(document.getElementById('speed').value, 10);
  timer = setInterval(function() {
    if (cur >= lastFrame) { stop(); return; }
    step(1);
  }, interval);
};
document.getElementById('prevBtn').onclick = function() { stop(); step(-1); };
document.getElementById('nextBtn').onclick = function() { stop(); step(1); };
slider.oninput = function() { stop(); cur = parseInt(this.value, 10); draw(); };
document.getElementById('speed').onchange = function() {
  if (playing) { stop(); document.getElementById('playBtn').click(); }
};
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
  if (e.key === ' ') { e.preventDefault(); document.getElementById('playBtn').click(); }
});

draw();
</script>
</body>
</html>
